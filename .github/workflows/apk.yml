name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera la carpeta android la primera vez y la guarda en el repo
      - name: Plataforma Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.cristianmares --project-name app_pacientes .
            rm -f test/widget_test.dart
            manifest=android/app/src/main/AndroidManifest.xml
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $manifest
            sed -i 's|android:label="app_pacientes"|android:label="Pacientes"|' $manifest
            git config user.name "CristianMares"
            git config user.email "78566073+CristianMares@users.noreply.github.com"
            git add android .metadata
            git commit -m "Plataforma Android"
            git push
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # Capturas de pantalla en tema claro y oscuro
      - name: Capturas
        run: |
          set -e
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          mkdir -p /tmp/inter-zip /tmp/inter
          unzip -q /tmp/inter.zip -d /tmp/inter-zip
          find /tmp/inter-zip -name 'Inter-*.ttf' -exec cp {} /tmp/inter/ \;
          ls /tmp/inter
          export FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          CAPTURAS=1 FUENTES=/tmp/inter flutter test test/capturas_test.dart --update-goldens
          cd test/capturas && zip -q ../../capturas.zip *.png
      # La llave de firma vive en los secrets del repo, nunca en el código
      - name: Llave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/pacientes.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=pacientes\nstoreFile=pacientes.jks\n" "$PASS" "$PASS" > android/key.properties
            echo "Firmando con la llave fija"
          else
            echo "::warning::Sin secrets de firma, se usa la llave de depuracion"
          fi

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app_pacientes
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app_pacientes.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app_pacientes.apk --title "APK" --notes "Descargar e instalar en el celular."
          gh release delete capturas -y --cleanup-tag || true
          gh release create capturas capturas.zip test/capturas/*.png --title "Capturas" --notes "Pantallas en tema claro y oscuro." --prerelease
